services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chu_nhiem_so
      POSTGRES_USER: chu_nhiem_so
      POSTGRES_PASSWORD: development-only-change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chu_nhiem_so -d chu_nhiem_so"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data: